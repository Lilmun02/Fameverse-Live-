name: Fameverse Engineering Gate

on:
  push:
    branches:
      - beta/**
      - feature/**
      - fix/**
      - hardening/**
      - release/**
  pull_request:
    branches:
      - main
      - beta/vercel-ready

permissions:
  contents: read

concurrency:
  group: fameverse-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm runner
        run: npm install --global npm@11.6.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static checks, unit tests, Fameverse laws, and production build
        run: npm run build

      - name: Release physical acceptance lock
        if: startsWith(github.ref, 'refs/heads/beta/') || startsWith(github.ref, 'refs/heads/release/') || github.base_ref == 'beta/vercel-ready'
        run: npm run check:release-physical

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Mobile browser smoke test
        run: npm run test:e2e
