name: Build 48 Policy Refresh Native Tests (No Release)

on:
  push:
    branches:
      - fix/build48-policy-idle-refresh-failclosed-nov25
    paths:
      - '.github/workflows/build48-policy-refresh-tests.yml'
      - 'native/flutter_v1/lib/app/fameverse_app.dart'
      - 'native/flutter_v1/lib/data/fv_policy_refresh.dart'
      - 'native/flutter_v1/test/fv_policy_refresh_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build48-policy-refresh-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-policy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native/flutter_v1
    steps:
      - name: Verify manually scoped source commit
        uses: actions/checkout@v4

      - name: Enforce source identity
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/build48-policy-idle-refresh-failclosed-nov25"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify source formatting (read-only)
        run: dart format --output=none --set-exit-if-changed lib/app/fameverse_app.dart lib/data/fv_policy_refresh.dart test/fv_policy_refresh_test.dart

      - name: Analyze native Flutter project
        run: flutter analyze

      - name: Exercise policy refresh behavior
        run: flutter test test/fv_policy_refresh_test.dart

      - name: Check complete Flutter test suite
        run: flutter test
