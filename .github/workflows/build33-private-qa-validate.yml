name: Build 33 Private QA Source Validation

on:
  push:
    branches:
      - qa/build33-private-iphone-oct07

permissions:
  contents: read

concurrency:
  group: build33-private-qa-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/flutter_v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned source ancestry
        working-directory: .
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f3dcf6f361551205fd5f70bb1ca0d51affc390c8 HEAD
          test "${GITHUB_REF_NAME}" = "qa/build33-private-iphone-oct07"

      - name: Validate Build 33 internal TestFlight upload safety
        working-directory: .
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            workflows = YAML.load_file("codemagic.yaml").fetch("workflows")
            qa = workflows.fetch("native-build33-internal-testflight")
            abort "wrong QA branch" unless qa.fetch("triggering").fetch("branch_patterns").any? { |r| r["pattern"] == "qa/build33-private-iphone-oct07" && r["include"] == true }
            groups = qa.fetch("environment").fetch("groups")
            abort "missing TestFlight credentials group" unless groups.include?("appstore_credentials")
            abort "missing manual signing group" unless groups.include?("manual_signing")
            publish = qa.fetch("publishing").fetch("app_store_connect")
            abort "TestFlight upload needs Apple credential mapping" unless publish.fetch("api_key") == "$APP_STORE_CONNECT_PRIVATE_KEY"
            abort "must never submit for external beta review" unless publish["submit_to_testflight"] == false
            abort "must never submit to public App Store" unless publish["submit_to_app_store"] == false
            abort "must not select beta groups" if publish.key?("beta_groups")
            scripts = qa.fetch("scripts").map { |s| s.fetch("script") }.join("\n")
            abort "wrong signing script" unless scripts.include?("build33_testflight_internal.sh")
            source = File.read("native/flutter_v1/tool/build33_testflight_internal.sh")
            abort "missing source lock" unless source.include?("source_branch=$TARGET_BRANCH")
            abort "missing internal-only IPA export" unless source.include?("testFlightInternalTestingOnly")
            abort "must not use Ad Hoc UDID profile" if source.include?("CM_QA_ADHOC_PROVISIONING_PROFILE")
            abort "missing internal-only export verification" unless source.include?("Print :testFlightInternalTestingOnly")
            abort "old Ad Hoc workflow must be retired" if workflows.key?("native-owner-private-qa")
            puts "Build 33 YAML parsed; internal TestFlight upload only"
          '
          bash -n native/flutter_v1/tool/build33_testflight_internal.sh
          ! grep -Fq "ImagePicker().pickVideo" native/flutter_v1/lib/features/profile/native_badge_transfer_preview.dart || {
            echo "BLOCKED: unapproved badge transfers must stay read-only"
            exit 1
          }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages and check formatting
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze, test, and compile Android for private QA
        run: |
          set -euo pipefail
          dart run tool/check_native_contract.dart
          flutter analyze
          flutter test
          # The repository intentionally does not commit generated Android shells.
          flutter create \
            --platforms=android \
            --org com.fameverse \
            --project-name live \
            --no-pub \
            /tmp/fameverse_qa_android
          cp -R /tmp/fameverse_qa_android/android ./android
          if [ -f android/app/build.gradle.kts ]; then
            sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i.bak 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          # Ubuntu needs an SVG rasterizer for Fameverse native branding.
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          bash tool/apply_android_branding.sh
          bash tool/verify_android_branding.sh
          flutter build apk --debug \
            --dart-define=FAMEVERSE_BUILD_FAMILY=33 \
            --dart-define=FAMEVERSE_SOURCE_SHA="${GITHUB_SHA}"
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo "QA compile passed; binaries remain in job environment because repository is public."

  ios-unsigned-qa:
    name: Build 33 iOS device compilation - unsigned (private QA)
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: native/flutter_v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Fameverse iOS shell
        run: |
          set -euo pipefail
          flutter create \
            --platforms=ios \
            --org com.fameverse \
            --project-name live \
            --no-pub \
            /tmp/fameverse_build33_ios
          cp -R /tmp/fameverse_build33_ios/ios ./ios
          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription Fameverse Live uses the camera while streaming." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Fameverse Live uses the camera while streaming." \
            ios/Runner/Info.plist
          /usr/libexec/PlistBuddy \
            -c "Set :NSMicrophoneUsageDescription Fameverse Live uses the microphone while streaming." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string Fameverse Live uses the microphone while streaming." \
            ios/Runner/Info.plist
          /usr/libexec/PlistBuddy \
            -c "Set :NSPhotoLibraryUsageDescription Fameverse lets you choose a profile photo." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string Fameverse lets you choose a profile photo." \
            ios/Runner/Info.plist
          bash tool/apply_ios_branding.sh
          bash tool/verify_ios_branding.sh
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.fameverse.live;' ios/Runner.xcodeproj/project.pbxproj

      - name: Resolve Flutter dependencies and install CocoaPods
        run: |
          set -euo pipefail
          flutter pub get
          find . -name Podfile -execdir pod install \;

      - name: Compile unsigned iPhone release code
        run: |
          set -euo pipefail
          flutter build ios --release --config-only --no-codesign \
            --dart-define=FAMEVERSE_BUILD_FAMILY=33 \
            --dart-define=FAMEVERSE_SOURCE_SHA="${GITHUB_SHA}"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          echo "iOS native code compiled successfully. Not signed or device installable."

      - name: Record unsigned compile provenance
        if: always()
        run: |
          printf '%s\n' \
            "branch=${GITHUB_REF_NAME}" \
            "commit=${GITHUB_SHA}" \
            "family=Build 33 QA" \
            "signing=unsigned" \
            "distribution=not-approved" >> "$GITHUB_STEP_SUMMARY"
