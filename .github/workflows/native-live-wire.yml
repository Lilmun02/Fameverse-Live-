name: Fameverse Native Live Wiring

on:
  push:
    branches:
      - native/flutter-v1
    paths:
      - '.github/workflows/native-live-wire.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-native-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4
        with:
          ref: native/flutter-v1
          fetch-depth: 0

      - name: Apply exact native live wiring
        run: python3 scripts/native_live_wire.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and format native code
        working-directory: native/flutter_v1
        run: |
          flutter pub get
          dart format lib test tool

      - name: Commit native live wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codemagic.yaml .github/workflows/native-preflight.yml native/flutter_v1
          if git diff --cached --quiet; then
            echo 'Native live wiring already applied.'
            exit 0
          fi
          git commit -m 'feat: wire native host-to-viewer live broadcast'
          git push origin HEAD:native/flutter-v1
