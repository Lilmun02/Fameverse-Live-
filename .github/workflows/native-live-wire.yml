name: Fameverse Native Live Repair

on:
  push:
    branches:
      - native/flutter-v1
    paths:
      - '.github/workflows/native-live-wire.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-native-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/flutter_v1
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4
        with:
          ref: native/flutter-v1
          fetch-depth: 0

      - name: Apply exact LiveKit analyzer repair
        working-directory: .
        run: python3 scripts/fix_livekit_analyzer.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and format native code
        run: |
          flutter pub get
          dart format lib test tool

      - name: Validate repaired native live slice
        run: |
          dart run tool/check_native_contract.dart
          flutter analyze
          flutter test

      - name: Commit repaired native live source
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/flutter_v1/lib/features/live/livekit_live_screen.dart
          if git diff --cached --quiet; then
            echo 'LiveKit analyzer repair already applied.'
            exit 0
          fi
          git commit -m 'fix: clear native LiveKit analyzer findings'
          git push origin HEAD:native/flutter-v1
