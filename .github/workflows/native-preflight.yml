name: Fameverse Native Preflight

on:
  push:
    branches:
      - native/flutter-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fameverse-native-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/flutter_v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Codemagic YAML parses
        working-directory: .
        run: ruby -e "require 'yaml'; YAML.load_file('codemagic.yaml'); puts 'codemagic.yaml parses'"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Enforce Fameverse native foundation law
        run: dart run tool/check_native_contract.dart

      - name: Verify Dart formatting
        run: |
          dart format lib test tool
          if ! git diff --exit-code -- lib test tool; then
            echo "Dart formatting changed tracked files. Commit the formatted output before Codemagic."
            exit 1
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  ios-preflight:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/flutter_v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap ephemeral Fameverse iOS shell
        run: |
          set -euo pipefail
          rm -rf /tmp/fameverse_flutter_ios
          flutter create \
            --platforms=ios \
            --org com.fameverse \
            --project-name live \
            --no-pub \
            /tmp/fameverse_flutter_ios
          rm -rf ios
          cp -R /tmp/fameverse_flutter_ios/ios ./ios

          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify locked Fameverse bundle identifier
        run: |
          set -euo pipefail
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"
          test -f "$PROJECT_FILE"
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = com.fameverse.live;" "$PROJECT_FILE"

      - name: Install CocoaPods dependencies
        run: find . -name "Podfile" -execdir pod install \;

      - name: Build unsigned release iOS app
        run: flutter build ios --release --no-codesign
