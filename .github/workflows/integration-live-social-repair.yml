name: Fameverse Live profile and rankings repair

on:
  push:
    branches:
      - integration/sep27-big-update
    paths:
      - scripts/apply-live-profile-rankings-repair.mjs

permissions:
  contents: write

concurrency:
  group: fameverse-live-social-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout locked integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/sep27-big-update
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply exact Live profile and rankings wiring
        run: node scripts/apply-live-profile-rankings-repair.mjs

      - name: Resolve Flutter packages
        working-directory: native/flutter_v1
        run: flutter pub get

      - name: Format repaired native source
        working-directory: native/flutter_v1
        run: dart format lib test tool

      - name: Static analysis
        working-directory: native/flutter_v1
        run: flutter analyze

      - name: Regression tests
        working-directory: native/flutter_v1
        run: flutter test

      - name: Diff safety check
        run: git diff --check

      - name: Persist only after green checks
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No Live social wiring changes were needed.'
            exit 0
          fi
          git config user.name 'Fameverse Live QA'
          git config user.email 'actions@users.noreply.github.com'
          git add native/flutter_v1/lib native/flutter_v1/test
          git commit -m 'fix(live): wire gifter profile card and rankings'
          git push origin HEAD:integration/sep27-big-update
