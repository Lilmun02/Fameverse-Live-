name: Temporary Build 32 Formatter

on:
  push:
    branches:
      - fix/build32-web-owner-creator-studio-pfp
    paths:
      - 'native/flutter_v1/lib/**'
      - 'native/flutter_v1/test/**'
      - 'native/flutter_v1/tool/**'
      - '.github/workflows/format-build32-fix.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/flutter_v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build32-web-owner-creator-studio-pfp
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test tool
      - name: Commit formatter output
        working-directory: .
        run: |
          set -euo pipefail
          if git diff --quiet -- native/flutter_v1/lib native/flutter_v1/test native/flutter_v1/tool; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/flutter_v1/lib native/flutter_v1/test native/flutter_v1/tool
          git commit -m "style: format final Build 32 repair contracts"
          git push origin HEAD:fix/build32-web-owner-creator-studio-pfp
