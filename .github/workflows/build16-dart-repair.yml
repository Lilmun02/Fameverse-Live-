name: Build 16 Dart Repair

on:
  push:
    branches:
      - native/flutter-v1
    paths:
      - '.github/workflows/build16-dart-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4
        with:
          ref: native/flutter-v1
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair literal dollar strings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          studio = Path('native/flutter_v1/lib/features/profile/creator_studio_screen.dart')
          text = studio.read_text()
          text = text.replace("'Minimum payout is $25.00. Every request goes through Fameverse review before money is released.'", "r'Minimum payout is $25.00. Every request goes through Fameverse review before money is released.'")
          text = text.replace("? 'Minimum payout is $25.00.'", "? r'Minimum payout is $25.00.'")
          text = text.replace("'When verified creator earnings reach $25, requests and their review status will appear here.'", "r'When verified creator earnings reach $25, requests and their review status will appear here.'")
          text = text.replace("'Minimum payout: $25.00'", "r'Minimum payout: $25.00'")
          studio.write_text(text)

          shell = Path('native/flutter_v1/lib/features/shell/fameverse_shell_build16.dart')
          text = shell.read_text()
          text = text.replace('The minimum payout request is $25.00.', 'The minimum payout request is \\$25.00.')
          shell.write_text(text)
          PY

      - name: Resolve packages
        working-directory: native/flutter_v1
        run: flutter pub get

      - name: Format native Dart
        working-directory: native/flutter_v1
        run: dart format lib test tool

      - name: Remove one-time repair workflow
        run: git rm .github/workflows/build16-dart-repair.yml

      - name: Commit repaired candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/flutter_v1 .github/workflows/build16-dart-repair.yml
          git commit -m 'fix: repair and format Build 16 native candidate'
          git push origin HEAD:native/flutter-v1
