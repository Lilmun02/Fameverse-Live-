name: Finalize Native V2 Render Layer

on:
  push:
    branches:
      - native/flutter-v1
    paths:
      - .github/workflows/native_v2_finalize.yml

permissions:
  contents: write

jobs:
  finalize-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native/flutter-v1
          fetch-depth: 0
      - name: Apply locked V2 render patch
        run: python3 tools/finalize_native_v2.py
      - name: Commit V2 source patch
        run: |
          if git diff --quiet; then
            echo "V2 source already finalized."
            exit 0
          fi
          git config user.name "Fameverse V2 Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add native/flutter_v1/lib/features/live/stream_host_live_screen.dart native/flutter_v1/lib/features/live/stream_viewer_live_screen.dart
          git commit -m "feat: finish native V2 live stage and gift laws"
          git push origin HEAD:native/flutter-v1
