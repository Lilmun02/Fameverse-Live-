  <text x="180" y="552" text-anchor="middle" fill="#ffd36a" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" letter-spacing="3">PREMIUM GIFT</text>
  <rect x="88" y="584" width="184" height="34" rx="17" fill="#09070d" stroke="#a94bff" opacity=".94"/>
  <text x="180" y="607" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="14" letter-spacing="2">FAMEVERSE LIVE</text>
