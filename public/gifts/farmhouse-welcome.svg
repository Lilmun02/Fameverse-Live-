<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Fameverse Farmhouse Welcome</title>
  <desc id="desc">Original stylized farmhouse gift artwork with purple accent lighting.</desc>
  <defs>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a5e"/>
      <stop offset="1" stop-color="#241326"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211124"/>
      <stop offset="1" stop-color="#0d0710"/>
    </linearGradient>
    <radialGradient id="windowGlow">
      <stop offset="0" stop-color="#f8d8ff"/>
      <stop offset=".45" stop-color="#b865ff"/>
      <stop offset="1" stop-color="#6f2fb4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>

  <ellipse cx="450" cy="612" rx="330" ry="48" fill="#6e2a9a" opacity=".16" filter="url(#softGlow)"/>
  <g opacity=".38">
    <circle cx="184" cy="206" r="76" fill="#8a4cc2" filter="url(#softGlow)"/>
    <circle cx="718" cy="236" r="70" fill="#7c39ae" filter="url(#softGlow)"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M164 334 449 126 739 334Z" fill="url(#roof)" stroke="#a65be2" stroke-opacity=".55" stroke-width="7"/>
    <rect x="218" y="318" width="464" height="264" rx="18" fill="url(#house)" stroke="#80508f" stroke-width="5"/>
    <path d="M337 318 449 233 562 318Z" fill="#331a39" stroke="#9a59c9" stroke-width="5"/>
    <rect x="400" y="244" width="98" height="85" rx="10" fill="#1d1022"/>
    <rect x="413" y="256" width="72" height="58" rx="6" fill="#bd6cff" opacity=".82"/>
    <circle cx="449" cy="285" r="70" fill="url(#windowGlow)" opacity=".35" filter="url(#softGlow)"/>

    <rect x="276" y="389" width="92" height="92" rx="8" fill="#190d1d" stroke="#6d3c79" stroke-width="4"/>
    <rect x="289" y="402" width="66" height="66" rx="4" fill="#c880ff" opacity=".82"/>
    <path d="M322 402v66M289 435h66" stroke="#f1dcff" stroke-opacity=".55" stroke-width="5"/>

    <rect x="533" y="389" width="92" height="92" rx="8" fill="#190d1d" stroke="#6d3c79" stroke-width="4"/>
    <rect x="546" y="402" width="66" height="66" rx="4" fill="#c880ff" opacity=".82"/>
    <path d="M579 402v66M546 435h66" stroke="#f1dcff" stroke-opacity=".55" stroke-width="5"/>

    <rect x="407" y="398" width="86" height="184" rx="9" fill="#120915" stroke="#9458af" stroke-width="5"/>
    <rect x="421" y="418" width="58" height="145" rx="5" fill="#28102d"/>
    <circle cx="466" cy="492" r="7" fill="#d8a2ff"/>

    <rect x="190" y="548" width="518" height="38" rx="12" fill="#171018"/>
    <rect x="252" y="517" width="400" height="34" rx="8" fill="#2d1732"/>
    <rect x="276" y="544" width="18" height="72" rx="7" fill="#1a0f1c"/>
    <rect x="606" y="544" width="18" height="72" rx="7" fill="#1a0f1c"/>

    <g stroke="#6c4075" stroke-width="12" stroke-linecap="round">
      <path d="M230 430v123M670 430v123"/>
      <path d="M226 443h448" opacity=".82"/>
    </g>
  </g>

  <g opacity=".78">
    <path d="M122 567c9-86 46-141 94-141 43 0 78 47 88 141Z" fill="#160d1a"/>
    <path d="M631 567c10-93 48-152 97-152 48 0 84 56 94 152Z" fill="#160d1a"/>
    <circle cx="178" cy="425" r="64" fill="#30203c"/>
    <circle cx="721" cy="414" r="72" fill="#30203c"/>
    <circle cx="178" cy="425" r="38" fill="#7a3aa5" opacity=".18"/>
    <circle cx="721" cy="414" r="43" fill="#7a3aa5" opacity=".18"/>
  </g>

  <g fill="#e6c8ff" opacity=".8">
    <circle cx="246" cy="220" r="5"/>
    <circle cx="655" cy="190" r="4"/>
    <circle cx="725" cy="295" r="6"/>
    <circle cx="171" cy="298" r="4"/>
    <circle cx="594" cy="250" r="3"/>
  </g>
</svg>
