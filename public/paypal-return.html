<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Fameverse · PayPal</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09070b; color: #f7eefb; padding: 24px; }
    main { width: min(480px, 100%); padding: 28px; border: 1px solid #55306d; border-radius: 26px; background: linear-gradient(145deg, #251231, #100b14 72%); box-shadow: 0 20px 70px rgba(83, 29, 122, .28); text-align: center; }
    .mark { width: 58px; height: 58px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 50%; background: #7b3bc3; box-shadow: 0 0 30px rgba(174, 92, 255, .55); font-weight: 900; font-size: 28px; font-style: italic; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 0; color: #c8b9ce; line-height: 1.5; }
    .status { margin-top: 20px; padding: 13px 16px; border-radius: 16px; background: #171019; color: #dfc4f5; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <div class="mark">F</div>
    <h1 id="title">Return to Fameverse</h1>
    <p id="copy">PayPal finished this browser step. Switch back to the Fameverse app to verify the order and update your Fame Coin balance.</p>
    <div class="status" id="status">FAMEVERSE · PAYPAL SANDBOX</div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('status') === 'cancelled') {
      document.getElementById('title').textContent = 'Payment cancelled';
      document.getElementById('copy').textContent = 'Nothing was credited. Return to Fameverse if you want to try again.';
      document.getElementById('status').textContent = 'NO CHARGE · NO COINS CREDITED';
    }
  </script>
</body>
</html>
