<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | Fameverse Live</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10071b;color:#fff;font:16px system-ui,sans-serif}
    main{width:min(420px,calc(100% - 48px));padding:28px;border:1px solid #563477;border-radius:20px;background:#21112e}
    h1{margin-top:0}label{display:block;margin:16px 0 8px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font:inherit}
    input{background:#10071b;color:#fff;border:1px solid #8563a6}button{margin-top:20px;border:0;background:#b783ff;color:#180526;font-weight:700}
    button:disabled{opacity:.6}#status{min-height:2em;line-height:1.4}a{color:#d7b6ff}
  </style>
</head>
<body>
<main>
  <h1>Fameverse Live</h1>
  <h2>Reset your password</h2>
  <p id="status" role="status" aria-live="polite">Verifying your recovery link…</p>
  <form id="reset" hidden>
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
    <button type="submit">Save new password</button>
  </form>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.112.4';
const client=createClient('https://lwasmvzsagowgmiqssph.supabase.co','sb_publishable_Zukw53JQ0R_rMuxxC1eeRg_28_QavNC',{
  auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}
});
const status=document.querySelector('#status');
const form=document.querySelector('#reset');
const url=new URL(location.href);
const fragment=new URLSearchParams(location.hash.slice(1));
const authError=url.searchParams.get('error_description')||fragment.get('error_description');
async function initialize(){
  if(authError)throw Error(authError);
  const tokenHash=url.searchParams.get('token_hash');
  if(tokenHash){
    const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
    if(error)throw error;
  }else if(url.searchParams.has('code')){
    const {error}=await client.auth.exchangeCodeForSession(url.searchParams.get('code'));
    if(error)throw error;
  }else{
    const access=fragment.get('access_token');
    const refresh=fragment.get('refresh_token');
    if(access&&refresh){
      const {error}=await client.auth.setSession({access_token:access,refresh_token:refresh});
      if(error)throw error;
    }
  }
  const {data:{session}}=await client.auth.getSession();
  if(!session)throw Error('This recovery link is invalid or expired. Request a fresh reset email.');
  history.replaceState(null,'','/reset-password.html');
  status.textContent='Enter a new password (at least 12 characters).';
  form.hidden=false;
}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const password=document.querySelector('#password').value;
  const confirm=document.querySelector('#confirm').value;
  if(password!==confirm){status.textContent='Passwords do not match.';return;}
  const button=form.querySelector('button');
  button.disabled=true;
  const {error}=await client.auth.updateUser({password});
  if(error){status.textContent=error.message;button.disabled=false;return;}
  await client.auth.signOut();
  form.hidden=true;
  status.textContent='Password updated. Return to Fameverse Live and sign in with your new password.';
});
initialize().catch(error=>{status.textContent=error.message||'Could not verify recovery link. Request a new email.'});
</script>
</body>
</html>
