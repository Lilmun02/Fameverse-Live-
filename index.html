<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10051f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fameverse" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Fameverse Live — Beta</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #10051f; }
      #root { min-height: 100vh; background: #10051f; }
      .boot-splash {
        position: fixed; inset: 0; display: grid; place-items: center;
        background:
          radial-gradient(circle at 50% 36%, rgba(145,55,255,.30), transparent 28rem),
          linear-gradient(180deg,#10051f,#07010d 60%,#020104);
        color: #fff; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      }
      .boot-splash > div { text-align: center; }
      .boot-mark {
        width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 22px;
        display: grid; place-items: center; font-size: 2rem; font-weight: 950;
        background: linear-gradient(145deg,#7d2cff,#d05eff);
        box-shadow: 0 18px 50px rgba(110,32,205,.34);
      }
      .boot-splash strong {
        display:block; letter-spacing:.045em;
        font-size: clamp(1.5rem, 6vw, 2rem); line-height:1;
      }
      .boot-splash strong span { color:#c45cff; }
      .boot-splash small { display:block; margin-top:12px; color:#b5a6c1; font-size:.82rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-label="Opening Fameverse">
        <div><div class="boot-mark">F</div><strong>FAMEVERSE <span>LIVE</span></strong><small>Opening your Fameverse…</small></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
