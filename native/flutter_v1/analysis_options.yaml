include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter stable currently flags the framework Material import as deprecated
    # across existing screens; defer framework migration, retain all other gates.
    deprecated_member_use: ignore
    dead_code: error
    unused_import: error
  exclude:
    - build/**

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    use_build_context_synchronously: true
