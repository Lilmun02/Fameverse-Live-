include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Temporary Flutter 3.50 framework deprecation; full Material migration is out of scope.
    deprecated_member_use: ignore
    dead_code: error
    unused_import: error
  exclude:
    - build/**

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    use_build_context_synchronously: true
