workflows:
  native-foundation:
    name: Fameverse Native Foundation
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: native/flutter_v1

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FAMEVERSE_NATIVE_STAGE: "bootstrap"
        FAMEVERSE_APP_NAME: "Fameverse"

    cache:
      cache_paths:
        - ~/.pub-cache

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'native/flutter-v1'
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Bootstrap ephemeral iOS and Android platform shells
        script: |
          set -euo pipefail
          rm -rf /tmp/fameverse_flutter_platforms
          flutter create \
            --platforms=ios,android \
            --org com.fameverse.dev \
            --project-name fameverse_live \
            --no-pub \
            /tmp/fameverse_flutter_platforms
          rm -rf ios android
          cp -R /tmp/fameverse_flutter_platforms/ios ./ios
          cp -R /tmp/fameverse_flutter_platforms/android ./android

          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :NSMicrophoneUsageDescription Fameverse Live uses the microphone for native live hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string Fameverse Live uses the microphone for native live hosting." \
            ios/Runner/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :NSPhotoLibraryUsageDescription Fameverse uses your photo library so you can choose a profile picture." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string Fameverse uses your photo library so you can choose a profile picture." \
            ios/Runner/Info.plist

          bash tool/apply_ios_branding.sh
          bash tool/apply_android_branding.sh

          if [ -f android/app/build.gradle.kts ]; then
            sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i.bak 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Resolve Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Enforce Fameverse native foundation law
        script: |
          set -euo pipefail
          dart run tool/check_native_contract.dart

      - name: Enforce Fameverse iOS branding law
        script: |
          set -euo pipefail
          bash tool/verify_ios_branding.sh

      - name: Enforce Fameverse Android branding law
        script: |
          set -euo pipefail
          bash tool/verify_android_branding.sh

      - name: Enforce Dart formatting
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        script: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        script: |
          set -euo pipefail
          flutter test

      - name: Build Android debug artifact
        script: |
          set -euo pipefail
          flutter build apk --debug

      - name: Build unsigned iOS debug artifact
        script: |
          set -euo pipefail
          flutter build ios --debug --no-codesign

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/ios/iphoneos/*.app
      - flutter_drive.log

  native-testflight:
    name: Fameverse Native TestFlight Candidate
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: native/flutter_v1

    environment:
      groups:
        - appstore_credentials
        - manual_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FAMEVERSE_NATIVE_STAGE: "testflight"
        FAMEVERSE_APP_NAME: "Fameverse"
        FAMEVERSE_BUILD_FAMILY: "32"
        BUNDLE_ID: "com.fameverse.live"

    cache:
      cache_paths:
        - ~/.pub-cache

    scripts:
      - name: Checkout locked Build 32 repair source
        script: |
          set -euo pipefail
          TARGET_BRANCH="integration/sep27-big-update"
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          cd "$REPO_ROOT"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git checkout --detach "refs/remotes/origin/$TARGET_BRANCH"
          SOURCE_SHA="$(git rev-parse HEAD)"
          TARGET_SHA="$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)"
          if [ "$SOURCE_SHA" != "$TARGET_SHA" ]; then
            echo "BLOCKED: checked-out source does not match $TARGET_BRANCH."
            exit 1
          fi
          echo "FAMEVERSE_SOURCE_SHA=$SOURCE_SHA" >> "$CM_ENV"
          printf '%s\n' "Build 32 repair candidate" "source_branch=$TARGET_BRANCH" "source_commit=$SOURCE_SHA" "trigger_branch=${CM_BRANCH:-unknown}" > "$REPO_ROOT/native/flutter_v1/build32_source_identity.txt"
          echo "Verified locked repair source: $TARGET_BRANCH@$SOURCE_SHA"

      - name: Verify Build 32 fixes and Fameboard exist in locked source
        script: |
          set -euo pipefail
          SHELL="lib/features/shell/fameverse_shell_build23.dart"
          PROFILE="lib/features/profile/native_profile_build23.dart"
          DISCOVER="lib/features/shell/fameverse_discover_screen.dart"
          RANKINGS="lib/features/live/native_live_rankings.dart"
          HOST_WRAPPER="lib/features/live/stream_owner_host_live_screen.dart"
          HOST_SURFACE="lib/features/live/stream_host_live_screen.dart"
          VIEWER_SURFACE="lib/features/live/stream_viewer_live_screen.dart"
          LIVE_COMPONENTS="lib/features/live/native_live_components.dart"
          GIFT_VISUAL="lib/features/live/native_gift_visual.dart"
          LIVE_EXPORT="lib/features/live/stream_live_screen.dart"
          STRIPE="../../supabase/functions/stripe-checkout-session/index.ts"

          grep -Fq "get_my_fameverse_identity" "$SHELL" || { echo "BLOCKED: authoritative owner identity route missing."; exit 1; }
          if grep -Fq "Build23OwnerControlCenterScreen" "$SHELL"; then echo "BLOCKED: native Owner Control Center must stay removed."; exit 1; fi
          grep -Fq "Creator Studio" "$PROFILE" || { echo "BLOCKED: Creator Studio profile entry missing."; exit 1; }
          grep -Fq "creator-fam-algorithm-card" "lib/features/profile/creator_studio_build23.dart" || { echo "BLOCKED: Creator Studio FAM tools missing."; exit 1; }
          grep -Fq "creator-gift-activity-card" "lib/features/profile/creator_studio_build23.dart" || { echo "BLOCKED: Creator Studio gift activity missing."; exit 1; }
          grep -Fq "creator-verification-center" "lib/features/profile/creator_studio_build23.dart" || { echo "BLOCKED: Creator Studio verification missing."; exit 1; }
          grep -Fq "profile-fame-coins-card" "$PROFILE" || { echo "BLOCKED: full Fame Coins card tap fix missing."; exit 1; }
          grep -Fq "owner-host-gift-button" "$HOST_SURFACE" || { echo "BLOCKED: owner host gift button missing."; exit 1; }
          grep -Fq "bool _flipCameraBusy = false;" "$HOST_SURFACE" || { echo "BLOCKED: host camera anti-spam repair missing."; exit 1; }
          grep -Fq "bool _cohostFlipBusy = false;" "$VIEWER_SURFACE" || { echo "BLOCKED: co-host camera anti-spam repair missing."; exit 1; }
          grep -Fq "record_beta_gift" "$HOST_WRAPPER" || { echo "BLOCKED: owner QA gift RPC path missing."; exit 1; }
          grep -Fq "onFinished" "$LIVE_COMPONENTS" || { echo "BLOCKED: completion-driven gift playback missing."; exit 1; }
          grep -Fq "VideoPlayerController.networkUrl" "$GIFT_VISUAL" || { echo "BLOCKED: cinematic gift tray still lacks real media previews."; exit 1; }
          grep -Fq "VideoPlayer(controller)" "$GIFT_VISUAL" || { echo "BLOCKED: cinematic gift tray is not rendering its real media frame."; exit 1; }
          grep -Fq "export 'stream_owner_host_live_screen.dart';" "$LIVE_EXPORT" || { echo "BLOCKED: host Live is not routed through owner gift wrapper."; exit 1; }


          grep -Fq "get_fameverse_rankings_v2" "$RANKINGS" || { echo "BLOCKED: authoritative Fameboard v2 RPC missing."; exit 1; }
          grep -Fq "fameboard-window-24h" "$RANKINGS" || { echo "BLOCKED: Fameboard 24H window missing."; exit 1; }
          grep -Fq "fameboard-window-7d" "$RANKINGS" || { echo "BLOCKED: Fameboard 7D window missing."; exit 1; }
          grep -Fq "Supporters" "$RANKINGS" || { echo "BLOCKED: Fameboard Supporters scope missing."; exit 1; }
          grep -Fq "Pulse" "$RANKINGS" || { echo "BLOCKED: Fameboard Pulse scope missing."; exit 1; }
          grep -Fq "discover-fameboard-card" "$DISCOVER" || { echo "BLOCKED: Discover Fameboard entry missing."; exit 1; }
          grep -Fq "showNativeLiveRankings(context)" "$DISCOVER" || { echo "BLOCKED: Discover Fameboard is not wired."; exit 1; }

          grep -Fq "managed_payments[enabled]" "$STRIPE" || { echo "BLOCKED: Stripe hosted checkout Managed Payments repair missing."; exit 1; }

          printf '%s\n' \
            "native_creator_studio=verified" \
            "native_owner_ops=removed" \
            "creator_verification=verified" \
            "host_camera_antispam=verified" \
            "cohost_camera_antispam=verified" \
            "gift_playback_completion=verified" \
            "fame_stones_card_touch=verified" \
            "fameboard_live=verified" \
            "fameboard_discover=verified" \
            "stripe_hosted_checkout_repair=verified" \
            >> build32_source_identity.txt
          echo "Verified Build 32 fixes and Fameboard in exact locked TestFlight source."

      - name: Verify required TestFlight secrets are present
        script: |
          set -euo pipefail
          for name in \
            APP_STORE_CONNECT_PRIVATE_KEY \
            APP_STORE_CONNECT_KEY_IDENTIFIER \
            APP_STORE_CONNECT_ISSUER_ID \
            CM_CERTIFICATE \
            CM_CERTIFICATE_PASSWORD \
            CM_PROVISIONING_PROFILE
          do
            if [ -z "$(eval "printf '%s' \"\${$name:-}\"")" ]; then
              echo "Missing required environment variable: $name"
              exit 1
            fi
          done
          echo "All required TestFlight secrets are present."

      - name: Bootstrap ephemeral Fameverse iOS shell
        script: |
          set -euo pipefail
          rm -rf /tmp/fameverse_flutter_ios
          flutter create \
            --platforms=ios \
            --org com.fameverse \
            --project-name live \
            --no-pub \
            /tmp/fameverse_flutter_ios
          rm -rf ios
          cp -R /tmp/fameverse_flutter_ios/ios ./ios

          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :NSMicrophoneUsageDescription Fameverse Live uses the microphone for native live hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string Fameverse Live uses the microphone for native live hosting." \
            ios/Runner/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :NSPhotoLibraryUsageDescription Fameverse uses your photo library so you can choose a profile picture." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string Fameverse uses your photo library so you can choose a profile picture." \
            ios/Runner/Info.plist

          bash tool/apply_ios_branding.sh

      - name: Resolve Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Verify locked Fameverse bundle identifier
        script: |
          set -euo pipefail
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"
          test -f "$PROJECT_FILE"
          if ! grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PROJECT_FILE"; then
            echo "Locked bundle identifier $BUNDLE_ID was not found in $PROJECT_FILE"
            exit 1
          fi
          echo "Verified bundle identifier: $BUNDLE_ID"

      - name: Enforce Fameverse iOS branding law
        script: |
          set -euo pipefail
          bash tool/verify_ios_branding.sh

      - name: Enforce Fameverse native foundation law
        script: |
          set -euo pipefail
          dart run tool/check_native_contract.dart

      - name: Enforce Dart formatting
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        script: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        script: |
          set -euo pipefail
          flutter test

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          find . -name "Podfile" -execdir pod install \;

      - name: Install Fameverse signing assets directly
        script: |
          set -euo pipefail
          keychain initialize

          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$PROFILES_HOME/fameverse_app_store.mobileprovision"
          printf '%s' "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" >/dev/null

          CERT_PATH="/tmp/fameverse_distribution.p12"
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          openssl pkcs12 \
            -in "$CERT_PATH" \
            -passin pass:"$CM_CERTIFICATE_PASSWORD" \
            -noout
          keychain add-certificates \
            --certificate "$CERT_PATH" \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --profile "$PROFILE_PATH"

      - name: Build signed Fameverse IPA candidate
        script: |
          set -euo pipefail
          test -n "${FAMEVERSE_SOURCE_SHA:-}"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define="FAMEVERSE_BUILD_FAMILY=32" \
            --dart-define="FAMEVERSE_SOURCE_SHA=${FAMEVERSE_SOURCE_SHA}" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build32_source_identity.txt
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

# Bootstrap remains non-publishing and continues to prove unsigned iOS plus Android.
# native-testflight always checks out the locked integration/sep27-big-update Build 32 repair source before validation/building.
# A user may trigger the workflow from another branch; the published candidate source is still the locked Build 32 repair branch.
# Every candidate publishes build32_source_identity.txt with the exact source commit used for the IPA.
# The TestFlight source gate blocks upload if the required Build 32 fixes or Fameboard wiring are absent from the exact locked checkout.
# TestFlight upload is a candidate checkpoint, never a product PASS.
# The candidate must be physically tested before external promotion / release approval.

native-owner-private-qa:
    name: Fameverse Build 33 - PRIVATE owner iPhone QA (NO PUBLISH)
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: native/flutter_v1

    environment:
      groups:
        - manual_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FAMEVERSE_NATIVE_STAGE: "bootstrap"
        FAMEVERSE_BUILD_FAMILY: "33"
        FAMEVERSE_APP_NAME: "Fameverse"
        FAMEVERSE_BUNDLE_ID: "com.fameverse.live"

    cache:
      cache_paths:
        - ~/.pub-cache

    # Exactly one private repair branch. NEVER triggers TestFlight publishing.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'qa/build33-private-iphone-oct07'
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Identify private Build 33 QA source and block stale checkout
        script: |
          set -euo pipefail
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          cd "$REPO_ROOT"
          test "${CM_BRANCH:-}" = "qa/build33-private-iphone-oct07" || {
            echo "BLOCKED: private QA workflow must run on exact owner QA branch."
            exit 1
          }
          SOURCE_SHA="$(git rev-parse HEAD)"
          # The private branch must contain the reviewed repair snapshot.
          git merge-base --is-ancestor f3dcf6f361551205fd5f70bb1ca0d51affc390c8 HEAD || {
            echo "BLOCKED: missing Build 33 repair base."
            exit 1
          }
          echo "FAMEVERSE_SOURCE_SHA=$SOURCE_SHA" >> "$CM_ENV"
          printf '%s\n' \
            "status=PRIVATE_QA_NOT_RELEASE_APPROVED" \
            "build_family=33" \
            "source_branch=${CM_BRANCH}" \
            "source_commit=$SOURCE_SHA" \
            "codemagic_build=${CM_BUILD_ID:-unknown}" \
            "publishing=disabled" > "$REPO_ROOT/native/flutter_v1/build33_private_qa_source.txt"
          echo "Private QA source pinned to $SOURCE_SHA"

      - name: Bootstrap iOS and Android shells for private QA
        script: |
          set -euo pipefail
          rm -rf /tmp/fameverse_private_qa_shells
          flutter create \
            --platforms=ios,android \
            --org com.fameverse \
            --project-name live \
            --no-pub \
            /tmp/fameverse_private_qa_shells
          rm -rf ios android
          cp -R /tmp/fameverse_private_qa_shells/ios ./ios
          cp -R /tmp/fameverse_private_qa_shells/android ./android
          for spec in \
            "NSCameraUsageDescription|Fameverse Live uses the camera during live streaming." \
            "NSMicrophoneUsageDescription|Fameverse Live uses the microphone during live streaming." \
            "NSPhotoLibraryUsageDescription|Fameverse lets you select a profile picture and private proof videos."
          do
            KEY="${spec%%|*}"
            VALUE="${spec#*|}"
            /usr/libexec/PlistBuddy -c "Set :$KEY $VALUE" ios/Runner/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$KEY string $VALUE" ios/Runner/Info.plist
          done
          bash tool/apply_ios_branding.sh
          bash tool/apply_android_branding.sh
          if [ -f android/app/build.gradle.kts ]; then
            sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i.bak 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.fameverse.live;' ios/Runner.xcodeproj/project.pbxproj || {
            echo "BLOCKED: mismatched Fameverse iOS bundle identifier."
            exit 1
          }

      - name: Resolve Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Static and contract gates for private QA
        script: |
          set -euo pipefail
          dart run tool/check_native_contract.dart
          bash tool/verify_ios_branding.sh
          bash tool/verify_android_branding.sh
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test

      - name: Compile private Android debug APK
        script: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define=FAMEVERSE_BUILD_FAMILY=33 \
            --dart-define=FAMEVERSE_SOURCE_SHA="$FAMEVERSE_SOURCE_SHA"
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Compile unsigned iOS QA code before provisioning
        script: |
          set -euo pipefail
          find . -name Podfile -execdir pod install \;
          flutter build ios --debug --no-codesign \
            --dart-define=FAMEVERSE_BUILD_FAMILY=33 \
            --dart-define=FAMEVERSE_SOURCE_SHA="$FAMEVERSE_SOURCE_SHA"

      - name: Validate device-installable Ad Hoc signing, without publishing
        script: |
          set -euo pipefail
          test -n "${CM_CERTIFICATE:-}" || {
            echo "BLOCKED: missing CM_CERTIFICATE distribution P12."
            exit 1
          }
          test -n "${CM_CERTIFICATE_PASSWORD:-}" || {
            echo "BLOCKED: missing CM_CERTIFICATE_PASSWORD."
            exit 1
          }
          # Prefer the QA-only variable; never mistake an App Store profile for device-installable signing.
          PROFILE_B64="${CM_QA_ADHOC_PROVISIONING_PROFILE:-${CM_PROVISIONING_PROFILE:-}}"
          test -n "$PROFILE_B64" || {
            echo "BLOCKED: add CM_QA_ADHOC_PROVISIONING_PROFILE with the owner's iPhone UDID."
            exit 1
          }
          PROFILE_PATH="/tmp/fameverse_private_qa.mobileprovision"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" -o /tmp/fameverse_qa_profile.plist
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' /tmp/fameverse_qa_profile.plist >/dev/null || {
            echo "BLOCKED: App Store profile cannot be installed directly on an iPhone. An Ad Hoc profile containing the owner's UDID is required."
            exit 1
          }
          QA_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/fameverse_qa_profile.plist)"
          QA_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/fameverse_qa_profile.plist)"
          QA_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/fameverse_qa_profile.plist)"
          test "$QA_APP_ID" = "$QA_TEAM_ID.com.fameverse.live" || {
            echo "BLOCKED: the Ad Hoc profile does not match com.fameverse.live."
            exit 1
          }
          keychain initialize
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/fameverse_qa_distribution.p12
          openssl pkcs12 -in /tmp/fameverse_qa_distribution.p12 \
            -passin pass:"$CM_CERTIFICATE_PASSWORD" -noout
          keychain add-certificates \
            --certificate /tmp/fameverse_qa_distribution.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/fameverse_private_qa.mobileprovision"
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --profile "$PROFILE_PATH"
          cat >/tmp/fameverse_qa_export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$QA_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>com.fameverse.live</key><string>$QA_PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF
          plutil -lint /tmp/fameverse_qa_export_options.plist
          echo "Verified device-installable Ad Hoc profile (owner must confirm iPhone UDID enrollment)."

      - name: Build signed PRIVATE Ad Hoc IPA (no TestFlight, no publishing)
        script: |
          set -euo pipefail
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=FAMEVERSE_BUILD_FAMILY=33 \
            --dart-define=FAMEVERSE_SOURCE_SHA="$FAMEVERSE_SOURCE_SHA" \
            --dart-define=FAMEVERSE_QA_ONLY=true \
            --export-options-plist=/tmp/fameverse_qa_export_options.plist
          test -n "$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          echo "PRIVATE owner-device QA artifact created. Distribution remains disabled."

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/ios/ipa/*.ipa
      - build33_private_qa_source.txt
      - flutter_drive.log

# IMPORTANT: native-owner-private-qa has NO publishing step and
# cannot alter the existing native-testflight workflow or release manifest.
