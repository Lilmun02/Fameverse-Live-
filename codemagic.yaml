workflows:
  shorebird-ota-readiness:
    name: Fameverse Shorebird OTA Readiness (Manual, No Publishing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: native/flutter_v1

    # Deliberately no 'triggering' or 'publishing': run only with owner approval.
    environment:
      flutter: 3.47.9
      groups:
        - shorebird
      vars:
        FAMEVERSE_OTA_STAGE: "readiness-only"

    scripts:
      - name: Enforce manual-only source and credentials gate
        script: |
          set -euo pipefail
          if [ "${CM_TRIGGER_SOURCE:-}" != "api" ]; then
            echo "BLOCKED: Shorebird readiness must be started manually."
            exit 1
          fi
          if [ "${CM_BRANCH:-}" != "chore/build48-shorebird-ota-readiness-nov15" ]; then
            echo "BLOCKED: unapproved OTA source branch."
            exit 1
          fi
          : "${CM_COMMIT:?BLOCKED: source commit is missing}"
          if [ "$(git rev-parse HEAD)" != "$CM_COMMIT" ]; then
            echo "BLOCKED: checked-out source does not match Codemagic commit."
            exit 1
          fi
          if [ -z "${SHOREBIRD_TOKEN:-}" ]; then
            echo "BLOCKED: Shorebird token not available from secure group."
            exit 1
          fi
          test -f shorebird.yaml
          grep -Fxq 'app_id: ea33cadb-6ccd-4491-af48-6a617223a462' shorebird.yaml
          grep -Fxq '    - shorebird.yaml' pubspec.yaml
          echo "Readiness source and secret presence verified; token value not logged."

      - name: Install Shorebird on the ephemeral builder
        script: |
          set -euo pipefail
          curl -fsSL https://shorebird.dev/install.sh | bash
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> "$CM_ENV"

      - name: Verify Shorebird authentication and Flutter checks
        script: |
          set -euo pipefail
          shorebird --version
          # Service-account keys cannot access personal-account endpoints used by
          # 'shorebird auth status'. Check a permitted read-only app-list endpoint.
          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null \
            --header "Authorization: Bearer ${SHOREBIRD_TOKEN}" \
            https://api.shorebird.dev/api/v1/apps
          echo "Shorebird service-account API access verified (read-only)."
          flutter pub get
          flutter analyze
          flutter test
          echo "Preflight only: NO Shorebird release, patch, store upload, or app publication."

  shorebird-android-dry-run:
    name: Fameverse Shorebird Android (Manual Dry Run, No Release)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: native/flutter_v1

    # NO automatic triggers, publishing, release upload, or distributable artifacts.
    environment:
      flutter: 3.47.9
      groups:
        - shorebird
      vars:
        FAMEVERSE_OTA_STAGE: "android-dry-run"
        FAMEVERSE_APP_NAME: "Fameverse"

    scripts:
      - name: Enforce owner-run source and credential gate
        script: |
          set -euo pipefail
          if [ "${CM_TRIGGER_SOURCE:-}" != "api" ]; then
            echo "BLOCKED: run Android Shorebird dry-run manually."
            exit 1
          fi
          if [ "${CM_BRANCH:-}" != "chore/build48-shorebird-ota-readiness-nov15" ]; then
            echo "BLOCKED: unapproved source branch."
            exit 1
          fi
          : "${CM_COMMIT:?BLOCKED: source commit is missing}"
          if [ "$(git rev-parse HEAD)" != "$CM_COMMIT" ]; then
            echo "BLOCKED: mismatched GitHub source SHA."
            exit 1
          fi
          if [ -z "${SHOREBIRD_TOKEN:-}" ]; then
            echo "BLOCKED: secure Shorebird token is missing."
            exit 1
          fi
          grep -Fxq 'name: fameverse_live' pubspec.yaml
          grep -Fxq 'app_id: ea33cadb-6ccd-4491-af48-6a617223a462' shorebird.yaml
          grep -Fxq '    - shorebird.yaml' pubspec.yaml
          echo "Dry-run source verified (secret value not logged)."

      - name: Generate locked Android shell and run native checks
        script: |
          set -euo pipefail
          bash tool/bootstrap_shorebird_android.sh
          flutter pub get
          dart run tool/check_native_contract.dart
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test

      - name: Install Shorebird CLI
        script: |
          set -euo pipefail
          curl -fsSL https://shorebird.dev/install.sh | bash
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> "$CM_ENV"

      - name: Compile Android Shorebird release dry-run WITHOUT upload
        script: |
          set -euo pipefail
          shorebird --version
          # --dry-run compiles and checks the baseline, but never creates a
          # Shorebird release. This is NOT a signed distribution candidate.
          shorebird release android --dry-run --flutter-version=3.47.9
          echo "Android Shorebird dry-run finished; no release or patch uploaded."

  shorebird-ios-dry-run:
    name: Fameverse Shorebird iOS (Manual Unsigned Dry Run, No Upload)
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: native/flutter_v1

    # No automatic trigger, publishing, signing, or distributable IPA.
    environment:
      flutter: 3.47.9
      xcode: 26.1
      cocoapods: default
      groups:
        - shorebird
      vars:
        FAMEVERSE_OTA_STAGE: "ios-dry-run"
        FAMEVERSE_APP_NAME: "Fameverse"

    scripts:
      - name: Enforce manual-only iOS source and secure token gates
        script: |
          set -euo pipefail
          if [ "${CM_TRIGGER_SOURCE:-}" != "api" ]; then
            echo "BLOCKED: Shorebird iOS dry-run must be started manually."
            exit 1
          fi
          if [ "${CM_BRANCH:-}" != "chore/build48-shorebird-ota-readiness-nov15" ]; then
            echo "BLOCKED: unapproved iOS dry-run source branch."
            exit 1
          fi
          : "${CM_COMMIT:?BLOCKED: exact source commit missing}"
          if [ "$(git rev-parse HEAD)" != "$CM_COMMIT" ]; then
            echo "BLOCKED: source SHA does not match Codemagic commit."
            exit 1
          fi
          if [ -z "${SHOREBIRD_TOKEN:-}" ]; then
            echo "BLOCKED: Shorebird service-account token unavailable."
            exit 1
          fi
          grep -Fxq 'name: fameverse_live' pubspec.yaml
          grep -Fxq 'app_id: ea33cadb-6ccd-4491-af48-6a617223a462' shorebird.yaml
          grep -Fxq '    - shorebird.yaml' pubspec.yaml
          echo "Approved iOS dry-run source, registration and secret presence verified."

      - name: Generate ephemeral Fameverse iOS shell and verify native contracts
        script: |
          set -euo pipefail
          bash tool/bootstrap_shorebird_ios.sh
          flutter pub get
          dart run tool/check_native_contract.dart
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test

      - name: Install iOS CocoaPods only if the generated shell has a Podfile
        script: |
          set -euo pipefail
          test -f ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Podfile ]; then
            # Propagate pod install failure instead of masking it through find.
            (cd ios && pod install)
          else
            # Flutter can use Swift Package Manager without a Podfile.
            # The Shorebird compile step remains mandatory and will fail if
            # the generated iOS project cannot resolve plugin dependencies.
            echo "No Podfile in the generated iOS shell; CocoaPods step not applicable."
          fi

      - name: Install Shorebird on ephemeral Mac builder
        script: |
          set -euo pipefail
          curl -fsSL https://shorebird.dev/install.sh | bash
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> "$CM_ENV"

      - name: Compile unsigned Shorebird iOS archive without publishing
        script: |
          set -euo pipefail
          shorebird --version
          # Both flags required: no Shorebird release upload and no IPA signing.
          shorebird release ios --dry-run --no-codesign --flutter-version=3.47.9
          echo "Unsigned iOS dry-run only; NO Shorebird upload, App Store, or TestFlight publishing."

  shorebird-ios-signed-dry-run:
    name: Fameverse Shorebird iOS (Manual Signed Dry Run, No Upload)
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: native/flutter_v1

    # Signature check only: no automatic trigger, Apple publishing, or Shorebird upload.
    environment:
      flutter: 3.47.9
      xcode: 26.1
      cocoapods: 1.16.2
      groups:
        - shorebird
        - manual_signing
      vars:
        FAMEVERSE_OTA_STAGE: "ios-signed-dry-run"
        FAMEVERSE_APP_NAME: "Fameverse"
        BUNDLE_ID: "com.fameverse.live"

    scripts:
      - name: Guard manual source, signing and Shorebird credentials
        script: |
          set -euo pipefail
          if [ "${CM_TRIGGER_SOURCE:-}" != "api" ]; then
            echo "BLOCKED: signed Shorebird dry-run must be manually started."
            exit 1
          fi
          if [ "${CM_BRANCH:-}" != "chore/build48-shorebird-ota-readiness-nov15" ]; then
            echo "BLOCKED: source is not the isolated owner-reviewed OTA branch."
            exit 1
          fi
          : "${CM_COMMIT:?BLOCKED: exact source SHA is missing}"
          if [ "$(git rev-parse HEAD)" != "$CM_COMMIT" ]; then
            echo "BLOCKED: source commit differs from triggering commit."
            exit 1
          fi
          : "${BUILD_NUMBER:?BLOCKED: Codemagic build number is missing}"
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "BLOCKED: Codemagic build number must be a positive integer."
            exit 1
          fi
          if [ -z "${SHOREBIRD_TOKEN:-}" ]; then
            echo "BLOCKED: secure Shorebird token missing."
            exit 1
          fi
          for name in CM_CERTIFICATE CM_CERTIFICATE_PASSWORD CM_PROVISIONING_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "BLOCKED: required Apple signing variable is missing: $name"
              exit 1
            fi
          done
          grep -Fxq 'name: fameverse_live' pubspec.yaml
          grep -Fxq 'app_id: ea33cadb-6ccd-4491-af48-6a617223a462' shorebird.yaml
          grep -Fxq '    - shorebird.yaml' pubspec.yaml
          echo "Reviewed source and credential presence verified; secrets not logged."

      - name: Generate iOS shell and verify existing Fameverse foundation laws
        script: |
          set -euo pipefail
          bash tool/bootstrap_shorebird_ios.sh
          flutter pub get
          dart run tool/check_native_contract.dart
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test

      - name: Resolve iOS CocoaPods if generated Podfile exists
        script: |
          set -euo pipefail
          test -f ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Podfile ]; then
            # Do not mask a genuine CocoaPods installation failure.
            (cd ios && pod install)
          else
            # The Flutter-generated project may use Swift Package Manager.
            # Shorebird compilation remains mandatory and must resolve plugins.
            echo "No Podfile in the generated iOS shell; CocoaPods step not applicable."
          fi

      - name: Install and verify existing Fameverse Apple signing assets
        script: |
          set -euo pipefail
          bash tool/prepare_shorebird_ios_signing.sh

      - name: Install official Shorebird CLI on ephemeral builder
        script: |
          set -euo pipefail
          curl -fsSL https://shorebird.dev/install.sh | bash
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> "$CM_ENV"

      - name: Generate signed Shorebird dry-run IPA, but DO NOT upload release
        script: |
          set -euo pipefail
          shorebird --version
          shorebird release ios --dry-run \
            --flutter-version=3.47.9 \
            --build-number="$BUILD_NUMBER" \
            --dart-define="FAMEVERSE_BUILD_FAMILY=47" \
            --dart-define="FAMEVERSE_SOURCE_SHA=$CM_COMMIT" \
            --export-options-plist=/Users/builder/export_options.plist
          echo "No Shorebird release registered and no TestFlight upload attempted."

      - name: Audit generated IPA identity and emit CI provenance
        script: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "BLOCKED: no signed Shorebird IPA was generated."
            exit 1
          fi
          INFO_PLIST="$(mktemp /tmp/fameverse-ota-ipa-info.XXXXXX)"
          trap 'rm -f "$INFO_PLIST"' EXIT
          unzip -p "$IPA" "Payload/Runner.app/Info.plist" > "$INFO_PLIST"
          test -s "$INFO_PLIST"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          if [ "$APP_ID" != "$BUNDLE_ID" ] || [ "$APP_BUILD" != "$BUILD_NUMBER" ]; then
            echo "BLOCKED: IPA app identity/build number mismatch."
            exit 1
          fi
          {
            echo "stage=shorebird-ios-signed-dry-run"
            echo "source_commit=$CM_COMMIT"
            echo "bundle_id=$APP_ID"
            echo "build_number=$APP_BUILD"
            echo "shorebird_release_registered=false"
            echo "testflight_uploaded=false"
          } > shorebird_ios_dry_run_identity.txt
          echo "Signed dry-run IPA identity verified; not a published TestFlight build."

    artifacts:
      - build/ios/ipa/*.ipa
      - shorebird_ios_dry_run_identity.txt

  native-foundation:
    name: Fameverse Native Foundation
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: native/flutter_v1

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FAMEVERSE_NATIVE_STAGE: "bootstrap"
        FAMEVERSE_APP_NAME: "Fameverse"

    cache:
      cache_paths:
        - ~/.pub-cache

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'native/flutter-v1'
          include: true
          source: true
        - pattern: 'build47/backend-utc-rankings-nov05'
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Bootstrap ephemeral iOS and Android platform shells
        script: |
          set -euo pipefail
          rm -rf /tmp/fameverse_flutter_platforms
          flutter create \
            --platforms=ios,android \
            --org com.fameverse.dev \
            --project-name fameverse_live \
            --no-pub \
            /tmp/fameverse_flutter_platforms
          rm -rf ios android
          cp -R /tmp/fameverse_flutter_platforms/ios ./ios
          cp -R /tmp/fameverse_flutter_platforms/android ./android

          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :NSMicrophoneUsageDescription Fameverse Live uses the microphone for native live hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string Fameverse Live uses the microphone for native live hosting." \
            ios/Runner/Info.plist

          bash tool/apply_ios_branding.sh
          bash tool/apply_android_branding.sh

          if [ -f android/app/build.gradle.kts ]; then
            sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i.bak 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Resolve Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Enforce Fameverse native foundation law
        script: |
          set -euo pipefail
          dart run tool/check_native_contract.dart

      - name: Enforce Fameverse iOS branding law
        script: |
          set -euo pipefail
          bash tool/verify_ios_branding.sh

      - name: Enforce Fameverse Android branding law
        script: |
          set -euo pipefail
          bash tool/verify_android_branding.sh

      - name: Enforce Dart formatting
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        script: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        script: |
          set -euo pipefail
          flutter test

      - name: Build Android debug artifact
        script: |
          set -euo pipefail
          flutter build apk --debug

      - name: Build unsigned iOS debug artifact
        script: |
          set -euo pipefail
          flutter build ios --debug --no-codesign

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/ios/iphoneos/*.app
      - flutter_drive.log

  native-testflight:
    name: Fameverse Native TestFlight Candidate
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: native/flutter_v1

    environment:
      groups:
        - appstore_credentials
        - manual_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FAMEVERSE_NATIVE_STAGE: "testflight"
        FAMEVERSE_APP_NAME: "Fameverse"
        FAMEVERSE_BUILD_FAMILY: "47"
        BUNDLE_ID: "com.fameverse.live"

    cache:
      cache_paths:
        - ~/.pub-cache

    scripts:
      - name: Verify exact triggered branch source
        script: |
          set -euo pipefail
          : "${CM_BRANCH:?BLOCKED: Codemagic branch is missing}"
          : "${CM_COMMIT:?BLOCKED: Codemagic commit is missing}"
          : "${CM_ENV:?BLOCKED: Codemagic environment file is missing}"
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          cd "$REPO_ROOT"
          # Pin the build to the exact commit that triggered Codemagic.
          git fetch --no-tags origin "+refs/heads/$CM_BRANCH:refs/remotes/origin/$CM_BRANCH"
          git cat-file -e "$CM_COMMIT^{commit}"
          git checkout --detach "$CM_COMMIT"
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "$SOURCE_SHA" != "$CM_COMMIT" ]; then
            echo "BLOCKED: checked-out source differs from the triggering commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CM_COMMIT" "refs/remotes/origin/$CM_BRANCH"; then
            echo "BLOCKED: triggering commit is not on the selected branch."
            exit 1
          fi
          if [ "$CM_BRANCH" = "feature/verse-pioneer-profile-oct11" ]; then
            grep -Fq "ProfileRecognitionBadges(userId: profile.id)" native/flutter_v1/lib/features/profile/fameverse_public_profile_screen.dart || { echo "BLOCKED: public profile recognition widget missing."; exit 1; }
            grep -Fq "verse-pioneer-profile-badge" native/flutter_v1/lib/features/profile/profile_recognition_badges.dart || { echo "BLOCKED: Pioneer badge widget missing."; exit 1; }
          fi
          echo "FAMEVERSE_SOURCE_SHA=$SOURCE_SHA" >> "$CM_ENV"
          printf '%s\n' "TestFlight candidate" "source_branch=$CM_BRANCH" "source_commit=$SOURCE_SHA" > "$REPO_ROOT/native/flutter_v1/build47_source_identity.txt"
          echo "Verified exact TestFlight source: $CM_BRANCH@$SOURCE_SHA"

      - name: Verify Build 47 baseline and Fameboard exist in locked source
        script: |
          set -euo pipefail
          SHELL="lib/features/shell/fameverse_shell_build23.dart"
          PROFILE="lib/features/profile/native_profile_build23.dart"
          OWNER="lib/features/profile/owner_control_center_build23.dart"
          DISCOVER="lib/features/shell/fameverse_discover_screen.dart"
          RANKINGS="lib/features/live/native_live_rankings.dart"
          HOST_WRAPPER="lib/features/live/stream_owner_host_live_screen.dart"
          HOST_SURFACE="lib/features/live/stream_host_live_screen.dart"
          VIEWER_SURFACE="lib/features/live/stream_viewer_live_screen.dart"
          LIVE_COMPONENTS="lib/features/live/native_live_components.dart"
          GIFT_VISUAL="lib/features/live/native_gift_visual.dart"
          LIVE_EXPORT="lib/features/live/stream_live_screen.dart"
          STRIPE="../../supabase/functions/stripe-checkout-session/index.ts"

          grep -Fq "get_my_fameverse_identity" "$SHELL" || { echo "BLOCKED: authoritative owner identity route missing."; exit 1; }
          # Owner Command Center is WEB ONLY. Preserve native personal Creator Studio.
          grep -Fq "_openPersonalCreatorStudio(currentProfile);" "$SHELL" || { echo "BLOCKED: personal Creator Studio route missing."; exit 1; }
          if grep -Fq "Build23OwnerControlCenterScreen(" "$SHELL" || grep -Fq "owner_control_center_build23.dart" "$SHELL"; then
            echo "BLOCKED: privileged Owner Command Center must remain web-only."
            exit 1
          fi
          grep -Fq "label: isOwner ? 'My Creator Account' : 'Creator Studio'" "$PROFILE" || { echo "BLOCKED: approved Creator Studio settings label missing."; exit 1; }
          grep -Fq "_WalletCard(userId: profile.id)" "$PROFILE" || { echo "BLOCKED: approved Fame Coins settings route missing."; exit 1; }
          grep -Fq "owner-host-gift-button" "$HOST_SURFACE" || { echo "BLOCKED: owner host gift button missing."; exit 1; }
          grep -Fq "bool _flipCameraBusy = false;" "$HOST_SURFACE" || { echo "BLOCKED: host camera anti-spam repair missing."; exit 1; }
          grep -Fq "if (confirmed == true && mounted) await _endLive();" "$HOST_SURFACE" || { echo "BLOCKED: host End Live confirmation missing."; exit 1; }
          grep -Fq "bool _cohostFlipBusy = false;" "$VIEWER_SURFACE" || { echo "BLOCKED: co-host camera anti-spam repair missing."; exit 1; }
          grep -Fq "record_beta_gift" "$HOST_WRAPPER" || { echo "BLOCKED: owner QA gift RPC path missing."; exit 1; }
          grep -Fq "onFinished" "$LIVE_COMPONENTS" || { echo "BLOCKED: completion-driven gift playback missing."; exit 1; }
          grep -Fq "VideoPlayerController.networkUrl" "$GIFT_VISUAL" || { echo "BLOCKED: cinematic gift tray still lacks real media previews."; exit 1; }
          grep -Fq "VideoPlayer(controller)" "$GIFT_VISUAL" || { echo "BLOCKED: cinematic gift tray is not rendering its real media frame."; exit 1; }
          grep -Fq "export 'stream_owner_host_live_screen.dart';" "$LIVE_EXPORT" || { echo "BLOCKED: host Live is not routed through owner gift wrapper."; exit 1; }

          grep -Fq "process-creator-payout" "$OWNER" || { echo "BLOCKED: PayPal payout submission wiring missing."; exit 1; }
          grep -Fq "sync-creator-payout" "$OWNER" || { echo "BLOCKED: PayPal payout sync wiring missing."; exit 1; }
          grep -Fq "get_creator_payout_moderation_queue_v2" "$OWNER" || { echo "BLOCKED: current payout recovery queue missing."; exit 1; }
          grep -Fq "owner-payout-recover-provider" "$OWNER" || { echo "BLOCKED: ambiguous PayPal recovery action missing."; exit 1; }
          grep -Fq "get_creator_verification_moderation_queue" "$OWNER" || { echo "BLOCKED: owner verification queue missing."; exit 1; }
          grep -Fq "review_creator_verification" "$OWNER" || { echo "BLOCKED: owner verification moderation action missing."; exit 1; }

          grep -Fq "get_fameverse_rankings_v2" "$RANKINGS" || { echo "BLOCKED: authoritative Fameboard v2 RPC missing."; exit 1; }
          grep -Fq "fameboard-window-24h" "$RANKINGS" || { echo "BLOCKED: Fameboard 24H window missing."; exit 1; }
          grep -Fq "fameboard-window-7d" "$RANKINGS" || { echo "BLOCKED: Fameboard 7D window missing."; exit 1; }
          grep -Fq "Supporters" "$RANKINGS" || { echo "BLOCKED: Fameboard Supporters scope missing."; exit 1; }
          grep -Fq "Pulse" "$RANKINGS" || { echo "BLOCKED: Fameboard Pulse scope missing."; exit 1; }
          grep -Fq "discover-fameboard-card" "$DISCOVER" || { echo "BLOCKED: Discover Fameboard entry missing."; exit 1; }
          grep -Fq "showNativeLiveRankings(context)" "$DISCOVER" || { echo "BLOCKED: Discover Fameboard is not wired."; exit 1; }

          # Build 47 must display the full owner-approved top 100 and UTC reset copy.
          # This source check does NOT assert that the matching Supabase migration is deployed.
          grep -Fq "'p_limit': 100" "$RANKINGS" || { echo "BLOCKED: native Fameboard is not requesting top 100."; exit 1; }
          grep -Fq "Daily ranking · resets at 00:00 UTC" "$RANKINGS" || { echo "BLOCKED: native UTC daily ranking copy missing."; exit 1; }
          grep -Fq "Weekly ranking · resets Sunday at 00:00 UTC" "$RANKINGS" || { echo "BLOCKED: native UTC weekly ranking copy missing."; exit 1; }
          test -f "../../supabase/migrations/20261105_build47_utc_rankings_top100.sql" || { echo "BLOCKED: paired Build 47 UTC ranking SQL is absent."; exit 1; }

          grep -Fq "managed_payments[enabled]" "$STRIPE" || { echo "BLOCKED: Stripe hosted checkout Managed Payments repair missing."; exit 1; }

          printf '%s\n' \
            "owner_studio=verified" \
            "payout_provider_submission=verified" \
            "payout_provider_sync=verified" \
            "verification_moderation=verified" \
            "host_camera_antispam=verified" \
            "cohost_camera_antispam=verified" \
            "gift_playback_completion=verified" \
            "fame_stones_card_touch=verified" \
            "fameboard_live=verified" \
            "fameboard_discover=verified" \
            "stripe_hosted_checkout_repair=verified" \
            >> build47_source_identity.txt
          echo "Verified Build 47 baseline and Fameboard in exact locked TestFlight source."

      - name: Verify required TestFlight secrets are present
        script: |
          set -euo pipefail
          for name in \
            APP_STORE_CONNECT_PRIVATE_KEY \
            APP_STORE_CONNECT_KEY_IDENTIFIER \
            APP_STORE_CONNECT_ISSUER_ID \
            CM_CERTIFICATE \
            CM_CERTIFICATE_PASSWORD \
            CM_PROVISIONING_PROFILE
          do
            if [ -z "$(eval "printf '%s' \"\${$name:-}\"")" ]; then
              echo "Missing required environment variable: $name"
              exit 1
            fi
          done
          echo "All required TestFlight secrets are present."

      - name: Bootstrap ephemeral Fameverse iOS shell
        script: |
          set -euo pipefail
          rm -rf /tmp/fameverse_flutter_ios
          flutter create \
            --platforms=ios \
            --org com.fameverse \
            --project-name live \
            --no-pub \
            /tmp/fameverse_flutter_ios
          rm -rf ios
          cp -R /tmp/fameverse_flutter_ios/ios ./ios

          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Fameverse Live uses the camera for native live preview and hosting." \
            ios/Runner/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :NSMicrophoneUsageDescription Fameverse Live uses the microphone for native live hosting." \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string Fameverse Live uses the microphone for native live hosting." \
            ios/Runner/Info.plist

          bash tool/apply_ios_branding.sh

      - name: Resolve Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Verify locked Fameverse bundle identifier
        script: |
          set -euo pipefail
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"
          test -f "$PROJECT_FILE"
          if ! grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PROJECT_FILE"; then
            echo "Locked bundle identifier $BUNDLE_ID was not found in $PROJECT_FILE"
            exit 1
          fi
          echo "Verified bundle identifier: $BUNDLE_ID"

      - name: Enforce Fameverse iOS branding law
        script: |
          set -euo pipefail
          bash tool/verify_ios_branding.sh

      - name: Enforce Fameverse native foundation law
        script: |
          set -euo pipefail
          dart run tool/check_native_contract.dart

      - name: Enforce Dart formatting
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        script: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        script: |
          set -euo pipefail
          flutter test

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          find . -name "Podfile" -execdir pod install \;

      - name: Install Fameverse signing assets directly
        script: |
          set -euo pipefail
          keychain initialize

          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$PROFILES_HOME/fameverse_app_store.mobileprovision"
          printf '%s' "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" >/dev/null

          CERT_PATH="/tmp/fameverse_distribution.p12"
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          openssl pkcs12 \
            -in "$CERT_PATH" \
            -passin pass:"$CM_CERTIFICATE_PASSWORD" \
            -noout
          keychain add-certificates \
            --certificate "$CERT_PATH" \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --profile "$PROFILE_PATH"

      - name: Build signed Fameverse IPA candidate
        script: |
          set -euo pipefail
          test -n "${FAMEVERSE_SOURCE_SHA:-}"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define="FAMEVERSE_BUILD_FAMILY=47" \
            --dart-define="FAMEVERSE_SOURCE_SHA=${FAMEVERSE_SOURCE_SHA}" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build47_source_identity.txt
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

# Bootstrap remains non-publishing and continues to prove unsigned iOS plus Android.
# native-testflight checks out exactly the triggering branch commit and verifies its source SHA.
# Build 47 source checks keep existing app safeguards plus top-100/UTC Fameboard copy.
# build47_source_identity.txt records the exact source commit used for any IPA candidate.
# The SQL source-file check does NOT prove the matching Supabase migration was applied.
# The existing TestFlight signing and publishing path is unchanged; a run/upload needs separate CEO approval.
# Any IPA is a candidate, never a product PASS without real Flutter/device/backend acceptance.
