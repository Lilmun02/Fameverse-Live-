workflows:
  native-foundation:
    name: Fameverse Native Foundation
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: native/flutter_v1

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FAMEVERSE_NATIVE_STAGE: "bootstrap"

    cache:
      cache_paths:
        - ~/.pub-cache

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'native/flutter-v1'
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Bootstrap ephemeral iOS and Android platform shells
        script: |
          set -euo pipefail
          rm -rf /tmp/fameverse_flutter_platforms
          flutter create \
            --platforms=ios,android \
            --org com.fameverse.dev \
            --project-name fameverse_live \
            --no-pub \
            /tmp/fameverse_flutter_platforms
          rm -rf ios android
          cp -R /tmp/fameverse_flutter_platforms/ios ./ios
          cp -R /tmp/fameverse_flutter_platforms/android ./android

      - name: Resolve Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Enforce Fameverse native foundation law
        script: |
          set -euo pipefail
          dart run tool/check_native_contract.dart

      - name: Enforce Dart formatting
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        script: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        script: |
          set -euo pipefail
          flutter test

      - name: Build Android debug artifact
        script: |
          set -euo pipefail
          flutter build apk --debug

      - name: Build unsigned iOS debug artifact
        script: |
          set -euo pipefail
          flutter build ios --debug --no-codesign

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/ios/iphoneos/*.app
      - flutter_drive.log

  native-testflight:
    name: Fameverse Native TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: native/flutter_v1

    integrations:
      app_store_connect: "Codemagic Fameverse"

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - fameverse_app_store
        certificates:
          - "Fameverse Distribution"
      vars:
        FAMEVERSE_NATIVE_STAGE: "testflight"

    cache:
      cache_paths:
        - ~/.pub-cache

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'native/flutter-v1'
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Bootstrap ephemeral Fameverse iOS shell
        script: |
          set -euo pipefail
          rm -rf /tmp/fameverse_flutter_ios
          flutter create \
            --platforms=ios \
            --org com.fameverse \
            --project-name live \
            --no-pub \
            /tmp/fameverse_flutter_ios
          rm -rf ios
          cp -R /tmp/fameverse_flutter_ios/ios ./ios

      - name: Verify locked Fameverse bundle identifier
        script: |
          set -euo pipefail
          DETECTED_BUNDLE_ID="$(xcode-project detect-bundle-id)"
          echo "Detected bundle identifier: ${DETECTED_BUNDLE_ID}"
          test "${DETECTED_BUNDLE_ID}" = "com.fameverse.live"

      - name: Resolve Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Enforce Fameverse native foundation law
        script: |
          set -euo pipefail
          dart run tool/check_native_contract.dart

      - name: Enforce Dart formatting
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        script: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        script: |
          set -euo pipefail
          flutter test

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          find . -name "Podfile" -execdir pod install \;

      - name: Apply App Store signing profile
        script: |
          set -euo pipefail
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build signed Fameverse IPA
        script: |
          set -euo pipefail
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration

# Bootstrap remains non-publishing and continues to prove unsigned iOS plus Android.
# TestFlight publishing is isolated to the signed native-testflight workflow.
# Signing secrets stay in Codemagic/Apple and are never committed to this repository.
